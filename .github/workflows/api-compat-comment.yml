name: API Compatibility Comment

on:
  workflow_run:
    workflows: ["API Compatibility"]
    types: [completed]

permissions: {}

jobs:
  comment:
    name: Comment on the pull request
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request' && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
    permissions:
      actions: read
      pull-requests: write
      issues: write
    steps:
      - name: Download the report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: api-compat-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/api-compat

      - name: Post or update the PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail

          # The artifact comes from a pull request run, so treat its content as untrusted.
          dir="$RUNNER_TEMP/api-compat"
          max_lines=300
          marker='<!-- api-compat-report -->'

          pr=$(head -c 32 "$dir/pr-number" | tr -cd '0-9')
          if [ -z "$pr" ]; then
            echo "::error::The report does not contain a valid pull request number"
            exit 1
          fi

          pr_json=$(gh api "repos/$REPO/pulls/$pr")
          pr_head=$(jq -r '.head.sha' <<< "$pr_json")
          base_ref=$(jq -r '.base.ref' <<< "$pr_json")
          if [ "$pr_head" != "$HEAD_SHA" ]; then
            echo "::notice::Skipping the comment because the report is for $HEAD_SHA but pull request #$pr is at $pr_head"
            exit 0
          fi

          existing_id=$(gh api --paginate "repos/$REPO/issues/$pr/comments" --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- api-compat-report -->"))) | .id' | sed -n '1p')

          status=$(head -c 16 "$dir/status" 2>/dev/null | tr -cd 'a-z' || true)
          if [ "$status" != "ok" ]; then
            if [ -z "$existing_id" ]; then
              echo "::notice::The check for $HEAD_SHA did not finish, and there is no earlier report to update"
              exit 0
            fi
            {
              printf '%s\n' "$marker"
              printf '### API compatibility check failed\n\n'
              printf 'Could not check commit `%s` because the build or apidiff failed, so the previous report no longer applies. See the [workflow run](%s) for details.\n' "${HEAD_SHA:0:7}" "$RUN_URL"
            } > "$RUNNER_TEMP/comment.md"
            gh api -X PATCH "repos/$REPO/issues/comments/$existing_id" -F body=@"$RUNNER_TEMP/comment.md" --silent
            exit 0
          fi

          incompatible=$(grep -c '^- ' "$dir/incompatible.txt" || true)
          compatible=$(grep -c '^- ' "$dir/compatible.txt" || true)

          # Strip carriage returns and backticks, and cap the number of lines.
          sanitize() {
            local file="$1" total="$2"
            # awk reads all input so an early pipe close cannot fail the step under pipefail.
            tr -d '\r' < "$file" | sed "s/\`/'/g" | awk -v n="$max_lines" 'NR<=n'
            if [ "$total" -gt "$max_lines" ]; then
              printf '... and %s more (see the workflow run summary)\n' "$((total - max_lines))"
            fi
          }

          if [ "$incompatible" -eq 0 ] && [ "$compatible" -eq 0 ] && [ -z "$existing_id" ]; then
            gh api -X DELETE "repos/$REPO/issues/$pr/labels/breaking-change" --silent >/dev/null 2>&1 || true
            exit 0
          fi

          body="$RUNNER_TEMP/comment.md"
          {
            printf '%s\n' "$marker"
            if [ "$incompatible" -gt 0 ]; then
              printf '### Breaking API changes detected\n\n'
              printf 'This PR introduces **%s** incompatible change(s) to the exported Go API compared with `%s`. If this is intended, please call it out in the PR title and the changelog.\n\n' "$incompatible" "$base_ref"
              printf '```text\n'
              sanitize "$dir/incompatible.txt" "$incompatible"
              printf '```\n'
            else
              printf '### No breaking API changes\n\n'
              printf 'The exported Go API stays compatible with `%s`.\n' "$base_ref"
            fi
            if [ "$compatible" -gt 0 ]; then
              printf '\n<details><summary>Compatible changes (%s)</summary>\n\n' "$compatible"
              printf '```text\n'
              sanitize "$dir/compatible.txt" "$compatible"
              printf '```\n\n'
              printf '</details>\n'
            fi
            printf '\n<sub>Checked commit %s with [apidiff](https://pkg.go.dev/golang.org/x/exp/cmd/apidiff). [Workflow run](%s)</sub>\n' "${HEAD_SHA:0:7}" "$RUN_URL"
          } > "$body"

          # GitHub rejects comments over 65,536 characters, so fall back to a short pointer to the run summary.
          if [ "$(wc -c < "$body")" -gt 60000 ]; then
            {
              printf '%s\n' "$marker"
              printf '### API compatibility report too large\n\n'
              printf 'See the [workflow run](%s) summary for the full list (%s incompatible, %s compatible).\n' "$RUN_URL" "$incompatible" "$compatible"
            } > "$body"
          fi

          if [ -n "$existing_id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing_id" -F body=@"$body" --silent
          else
            gh api "repos/$REPO/issues/$pr/comments" -F body=@"$body" --silent
          fi

          if [ "$incompatible" -gt 0 ]; then
            gh label create breaking-change --repo "$REPO" --color B60205 --description "Introduces an incompatible change to the exported API" >/dev/null 2>&1 || true
            gh api "repos/$REPO/issues/$pr/labels" -f 'labels[]=breaking-change' --silent
          else
            gh api -X DELETE "repos/$REPO/issues/$pr/labels/breaking-change" --silent >/dev/null 2>&1 || true
          fi
